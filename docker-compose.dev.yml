version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: re-astr-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: re-astr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network-dev

  minio:
    image: minio/minio:latest
    container_name: re-astr-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - re-astr-network-dev

volumes:
  postgres_data_dev:
    driver: local
  minio_data_dev:
    driver: local

networks:
  re-astr-network-dev:
    driver: bridge
