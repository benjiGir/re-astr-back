version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: re-astr-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: re-astr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network-dev

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: re-astr-garage-dev
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API (bootstrap script + debugging)
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta_dev:/data/meta
      - garage_data_dev:/data/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network-dev

volumes:
  postgres_data_dev:
    driver: local
  garage_meta_dev:
    driver: local
  garage_data_dev:
    driver: local

networks:
  re-astr-network-dev:
    driver: bridge
