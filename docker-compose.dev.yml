version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: re-astr-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: re-astr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network-dev

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: re-astr-garage-dev
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API (bootstrap script + debugging)
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta_dev:/data/meta
      - garage_data_dev:/data/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network-dev

  # jaegertracing/all-in-one runs as uid 10001 (gid 0), but a fresh named
  # volume is created root:root — this one-shot init chowns it first so
  # Badger can create /badger/data and /badger/key on startup.
  jaeger-volume-init:
    image: busybox
    container_name: re-astr-jaeger-volume-init-dev
    command: ["sh", "-c", "mkdir -p /badger/data /badger/key && chown -R 10001:0 /badger"]
    volumes:
      - jaeger_data_dev:/badger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: re-astr-jaeger-dev
    depends_on:
      jaeger-volume-init:
        condition: service_completed_successfully
    ports:
      - "16686:16686" # Web UI
      - "4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data_dev:/badger
    networks:
      - re-astr-network-dev

volumes:
  postgres_data_dev:
    driver: local
  garage_meta_dev:
    driver: local
  garage_data_dev:
    driver: local
  jaeger_data_dev:
    driver: local

networks:
  re-astr-network-dev:
    driver: bridge
