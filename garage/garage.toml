# Single-node dev/self-hosted config. Secrets are hardcoded here on purpose,
# same dev-grade posture as the old MinIO compose service (minioadmin/minioadmin) —
# replace rpc_secret/admin_token/metrics_token before any real production use.
metadata_dir = "/data/meta"
data_dir = "/data/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "60ac74248e7050478909924d126d76400e6969283ae027040e5c2a90ae6475c4"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "re-astr-dev-admin-token-change-in-prod"
metrics_token = "re-astr-dev-metrics-token-change-in-prod"
