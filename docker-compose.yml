version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: re-astr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: re-astr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: re-astr-garage
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/data/meta
      - garage_data:/data/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - re-astr-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re-astr-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/re-astr
      # No fallback on purpose: infra/Config.ts's SessionConfig has no default
      # for cookieSecret either, so boot fails loudly if it's missing — a
      # `:-change-me-in-production` fallback here would silently defeat that
      # at the compose layer (the original bug this was meant to fix).
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set}
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_REGION: garage
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - re-astr-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  re-astr-network:
    driver: bridge